name: store-service development

on:
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: store-service-development
  cancel-in-progress: false

jobs:
  images:
    uses: sellgar/sellgar.infrastructure/.github/workflows/build-service.yml@delivery-v0.6.0
    permissions:
      contents: write
      packages: write
    secrets:
      SUBMODULES_READ_TOKEN: ${{ secrets.SUBMODULES_READ_TOKEN }}
    with:
      release-name: store-service
      migrations: true
      publish: true

  delivery:
    needs: images
    uses: sellgar/sellgar.infrastructure/.github/workflows/deliver-service.yml@delivery-v0.6.0
    secrets:
      SUBMODULES_READ_TOKEN: ${{ secrets.SUBMODULES_READ_TOKEN }}
    with:
      environment: dev
      namespace: sellgar-dev
      release-name: store-service
      source-revision: ${{ github.sha }}
      chart-revision: ${{ needs.images.outputs.chart-revision }}
      image-digest: ${{ needs.images.outputs.image-digest }}
      migration-image-digest: ${{ needs.images.outputs.migration-image-digest }}
